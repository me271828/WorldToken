# RoboCasa VisualCore-FiLM encoder config.
#
# This keeps the current worldtoken sequence/action/prediction stack, but
# swaps the observation encoder to the RoboCasa BC-Transformer style:
#   3 cameras * 64 VisualCore features + 16 low-dim = 208 -> Linear -> 512.

env: robocasa

model:
  latent_dim: 512
  action_chunk_len: 1

encoder:
  type: robocasa_visual_film
  feature_dim: 64
  crop_height: 116
  crop_width: 116
  num_crops: 1
  pos_enc: false
  backbone_class: ResNet18ConvFiLM
  backbone_kwargs:
    pretrained: false
    input_coord_conv: false
  pool_class: SpatialSoftmax
  pool_kwargs:
    num_kp: 32
    learnable_temperature: false
    temperature: 1.0
    noise_std: 0.0
  use_proprio: true
  low_dim_mode: identity
  projection_bias: true
  # robomimic_src omitted: resolved from $ROBOMIMIC_SRC (see worldtoken/paths.py)

sequence_model:
  type: continuous_transformer
  backbone_type: qwen2
  hidden_dim: 512
  n_layers: 2
  n_heads: 8
  n_kv_heads: null
  ffn_hidden_size: 1024
  dropout: 0.1
  max_context_len: 1024
  input_norm: false
  model_dtype: float32
  attn_impl: sdpa

action_head:
  type: diffusion
  denoising_steps: 20
  time_dim: 16
  mlp_dims: [1024, 1024, 1024]
  residual_style: true

dynamics:
  enabled: true
  type: film
  action_emb: 256
  depth: 48
  mults: [2, 3, 4, 4]
  kernel_size: 5

# --- training-loop params (trainer CLI defaults; not model structure) ---
filter_key: 50_demos
lang_emb_mode: clip
seq_len: 10
obs_stride: 1
crops_per_demo: 8
pred_next_steps: 1
pred_next_proprio_weight: 0.15
batch_size: 16
max_steps: 60000
lr: 3.0e-4
warmup_steps: 1000
weight_decay: 0.1
grad_clip: 1.0
precision: bf16
eval_every: 20000
save_every: 1000
holdout_size: 30
save_holdout_traces: true
