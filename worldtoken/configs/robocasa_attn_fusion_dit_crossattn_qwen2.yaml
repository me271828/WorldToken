# attn_fusion encoder + DiT action head with obs-token cross-attention.
#
# Derived from robocasa_prop015_mg5_attn_fusion_qwen2.yaml. The change is the
# action head: a DiT-style transformer denoiser whose every block cross-attends
# to the encoder's exported obs tokens (194 = 3 cameras * 8*8 patches + proprio
# + lang, width 512) in addition to the pooled global condition h. This restores
# the spatial detail the Q-Former readout pools away, for precise manipulation.
#
# obs_token_dim is injected from encoder.d_model (512) by the builder; it is NOT
# set here. use_obs_cross_attn=False would make this head a plain DiT (no KV).
# obs_tokens_source can be post_fusion (default/current behavior) or pre_fusion.

env: robocasa

model:
  latent_dim: 2048
  action_chunk_len: 1

encoder:
  type: attn_fusion
  d_model: 512
  n_fusion_layers: 2
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  readout_queries: 4
  use_proprio: true
  cnn_depth: 48
  cnn_mults: [2, 3, 4, 4]
  cnn_kernel: 5
  rope_theta: 10000.0

sequence_model:
  type: continuous_transformer
  backbone_type: qwen2
  hidden_dim: 2048
  n_layers: 2
  n_heads: 16
  n_kv_heads: null
  ffn_hidden_size: 1024
  dropout: 0.1
  max_context_len: 1024
  input_norm: false
  model_dtype: float32
  attn_impl: sdpa

action_head:
  type: diffusion_dit
  use_obs_cross_attn: true
  obs_tokens_source: post_fusion
  denoising_steps: 20
  d_model: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.0

dynamics:
  enabled: true
  type: film
  action_emb: 256
  depth: 48
  mults: [2, 3, 4, 4]
  kernel_size: 5

# --- training-loop params (trainer CLI defaults; not model structure) ---
filter_key: 3000_demos
lang_emb_mode: clip
seq_len: 10
obs_stride: 1
crops_per_demo: 8
pred_next_steps: 1
pred_next_proprio_weight: 0.15
batch_size: 48
max_steps: 100000
lr: 3.0e-4
warmup_steps: 1000
weight_decay: 0.1
grad_clip: 1.0
precision: bf16
eval_every: 20000
save_every: 20000
holdout_size: 30
save_holdout_traces: true
lang_emb_cache: ${ROBOCASA_RUN_DIR}/robocasa_mg_partial_lang_emb_cache.npz
