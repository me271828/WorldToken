[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "worldtoken"
version = "0.1.0"
description = "WorldToken: Time-First Sequence Modeling for Robotic Imitation Learning"
requires-python = ">=3.10"
# WorldToken is MIT; bundled third-party portions retain Apache-2.0.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "torch",
    "numpy",
    "transformers",
    "diffusers",
    "h5py",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/me271828/WorldToken"
Paper = "https://arxiv.org/abs/2608.22591"
"Experiment Records" = "https://huggingface.co/datasets/mepi31415/WorldToken_Experiment_Records"
Checkpoints = "https://huggingface.co/mepi31415/WorldToken_Checkpoints"

[project.optional-dependencies]
train = ["tqdm", "opencv-python-headless>=4.8,<5"]
rollout = ["imageio", "imageio-ffmpeg"]
robocasa = ["robomimic", "robosuite", "robocasa"]
dev = ["pytest", "ruff"]
analysis = ["matplotlib", "scipy"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["worldtoken*", "experiments*"]

[tool.setuptools.package-data]
experiments = ["**/*.json", "**/*.json.gz", "**/*.patch", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["worldtoken/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Conservative baseline: real bugs (pyflakes + syntax), not style/import-order churn.
select = ["F", "E9"]
ignore = ["E741"]
