# RoboCasa BC config using the attention-fusion encoder (attn_fusion).
#
# Same as robocasa_qwen2.yaml except the observation encoder keeps per-camera
# spatial patch tokens and fuses them with language/proprio via global
# self-attention (2D vision RoPE on image patches), pooling to one continuous
# vector per timestep with a learned readout query. See encoder/attn_fusion.py.

env: robocasa

model:
  latent_dim: 2048          # continuous-token width shared by all components
  action_chunk_len: 10

encoder:
  type: attn_fusion
  d_model: 512              # fusion-transformer width; head_dim=d_model/n_heads must be %4==0
  n_fusion_layers: 2
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  # readout is a Q-Former-style stack; defaults readout_depth=1,
  # readout_mlp_ratio=2 -> a depth-1 block (cross-attn + SwiGLU + residual),
  # NOT the old bare one-shot pool. Bump readout_depth to deepen.
  use_proprio: true
  cnn_depth: 48
  cnn_mults: [2, 3, 4, 4]
  cnn_kernel: 5
  rope_theta: 10000.0

sequence_model:
  type: continuous_transformer
  backbone_type: qwen2        # qwen2 | llama | mistral
  hidden_dim: 2048            # transformer internal d_model (defaults to latent_dim if omitted)
  n_layers: 2
  n_heads: 16
  n_kv_heads: null
  ffn_hidden_size: 1024
  dropout: 0.1
  max_context_len: 1024
  input_norm: false
  model_dtype: float32
  attn_impl: sdpa             # eager | sdpa | flash_attention_2 (GPU)

action_head:
  type: diffusion
  denoising_steps: 20
  time_dim: 16
  mlp_dims: [1024, 1024, 1024]
  residual_style: true

dynamics:
  enabled: true
  type: film                 # film | transition
  action_emb: 256
  depth: 48
  mults: [2, 3, 4, 4]
  kernel_size: 5

# --- training-loop params (trainer CLI defaults; not model structure) ---
filter_key: 50_demos
lang_emb_mode: clip
seq_len: 10
obs_stride: 1
crops_per_demo: 8
pred_next_steps: 1
batch_size: 16
max_steps: 60000
lr: 3.0e-4
warmup_steps: 1000
weight_decay: 0.1
grad_clip: 1.0
precision: bf16
eval_every: 20000
save_every: 1000
holdout_size: 30
