# RoboCasa BC config for diffusion_wm with the 1D temporal U-Net action head.
#
# Identical to robocasa_qwen2.yaml except `action_head` swaps the lightweight MLP
# denoiser (`type: diffusion`) for DPPO's `Unet1D` (`type: diffusion_unet`):
# stronger backbone + FiLM conditioning, same DDPM schedule. With
# action_chunk_len=10, dim_mults must keep the horizon divisible by
# 2**(len(dim_mults)-1) -- (1,2) gives 10 -> 5 -> 10.

env: robocasa

model:
  latent_dim: 2048          # continuous-token width shared by all components
  action_chunk_len: 10

encoder:
  type: attn_fusion
  d_model: 512              # fusion-transformer width; head_dim=d_model/n_heads must be %4==0
  n_fusion_layers: 2
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  use_proprio: true
  cnn_depth: 48
  cnn_mults: [2, 3, 4, 4]
  cnn_kernel: 5
  rope_theta: 10000.0

sequence_model:
  type: continuous_transformer
  backbone_type: qwen2        # qwen2 | llama | mistral
  hidden_dim: 2048            # transformer internal d_model (defaults to latent_dim if omitted)
  n_layers: 2
  n_heads: 16
  n_kv_heads: null
  ffn_hidden_size: 1024
  dropout: 0.1
  max_context_len: 1024
  input_norm: false
  model_dtype: float32
  attn_impl: sdpa             # eager | sdpa | flash_attention_2 (GPU)

action_head:
  type: diffusion_unet
  denoising_steps: 20
  dim: 64
  dim_mults: [1, 2]
  diffusion_step_embed_dim: 16
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

dynamics:
  enabled: true
  type: film                 # film | transition
  action_emb: 256
  depth: 48
  mults: [2, 3, 4, 4]
  kernel_size: 5

# --- training-loop params (trainer CLI defaults; not model structure) ---
filter_key: 50_demos
lang_emb_mode: clip
seq_len: 10
obs_stride: 1
crops_per_demo: 8
pred_next_steps: 1
batch_size: 16
max_steps: 60000
lr: 3.0e-4
warmup_steps: 1000
weight_decay: 0.1
grad_clip: 1.0
precision: bf16
eval_every: 20000
save_every: 1000
holdout_size: 30
